<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="690" viewBox="0 0 1200 690" role="img" aria-labelledby="title desc">
  <title id="title">Codex Deck Stream Deck Plus control map</title>
  <desc id="desc">Eight keys for six agents, Proceed, and Decline or Stop; a four-zone touch strip; and four dials for Agent, Reasoning and Model, Workflow, and Backend.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07111f"/>
      <stop offset="1" stop-color="#101827"/>
    </linearGradient>
    <linearGradient id="device" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#283447"/>
      <stop offset="1" stop-color="#161e2b"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#000" flood-opacity="0.45"/>
    </filter>
    <style>
      .title { font: 700 28px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #f8fafc; }
      .subtitle { font: 500 15px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #94a3b8; }
      .key-title { font: 700 19px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #f8fafc; }
      .key-sub { font: 500 13px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #a8c7ef; }
      .strip-title { font: 700 14px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #e2e8f0; }
      .strip-sub { font: 500 11px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #94a3b8; }
      .dial-label { font: 700 13px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #cbd5e1; }
      .legend { font: 600 13px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #cbd5e1; }
    </style>
  </defs>

  <rect width="1200" height="690" rx="28" fill="url(#bg)"/>
  <text x="60" y="48" class="title">Codex Deck — exact MVP control surface</text>
  <text x="60" y="72" class="subtitle">Six durable agent slots · deliberate authority controls · four contextual encoders</text>

  <g filter="url(#shadow)">
    <rect x="105" y="96" width="990" height="520" rx="38" fill="url(#device)" stroke="#475569" stroke-width="2"/>
  </g>

  <g>
    <rect x="145" y="126" width="210" height="128" rx="19" fill="#0b203a" stroke="#2388ff" stroke-width="4"/>
    <text x="250" y="178" text-anchor="middle" class="key-title">AGENT 1</text>
    <text x="250" y="207" text-anchor="middle" class="key-sub">select · hold to run</text>
    <circle cx="326" cy="151" r="7" fill="#20c878"/>

    <rect x="378" y="126" width="210" height="128" rx="19" fill="#0b203a" stroke="#2388ff" stroke-width="4"/>
    <text x="483" y="178" text-anchor="middle" class="key-title">AGENT 2</text>
    <text x="483" y="207" text-anchor="middle" class="key-sub">select · hold to run</text>
    <circle cx="559" cy="151" r="7" fill="#2388ff"/>

    <rect x="611" y="126" width="210" height="128" rx="19" fill="#0b203a" stroke="#2388ff" stroke-width="4"/>
    <text x="716" y="178" text-anchor="middle" class="key-title">AGENT 3</text>
    <text x="716" y="207" text-anchor="middle" class="key-sub">select · hold to run</text>
    <circle cx="792" cy="151" r="7" fill="#f4a62a"/>

    <rect x="844" y="126" width="210" height="128" rx="19" fill="#0b203a" stroke="#2388ff" stroke-width="4"/>
    <text x="949" y="178" text-anchor="middle" class="key-title">AGENT 4</text>
    <text x="949" y="207" text-anchor="middle" class="key-sub">select · hold to run</text>
    <circle cx="1025" cy="151" r="7" fill="#94a3b8"/>

    <rect x="145" y="276" width="210" height="128" rx="19" fill="#0b203a" stroke="#2388ff" stroke-width="4"/>
    <text x="250" y="328" text-anchor="middle" class="key-title">AGENT 5</text>
    <text x="250" y="357" text-anchor="middle" class="key-sub">select · hold to run</text>
    <circle cx="326" cy="301" r="7" fill="#20c878"/>

    <rect x="378" y="276" width="210" height="128" rx="19" fill="#0b203a" stroke="#2388ff" stroke-width="4"/>
    <text x="483" y="328" text-anchor="middle" class="key-title">AGENT 6</text>
    <text x="483" y="357" text-anchor="middle" class="key-sub">select · hold to run</text>
    <circle cx="559" cy="301" r="7" fill="#ef4444"/>

    <rect x="611" y="276" width="210" height="128" rx="19" fill="#0b2b23" stroke="#20c878" stroke-width="4"/>
    <text x="716" y="328" text-anchor="middle" class="key-title">PROCEED</text>
    <text x="716" y="355" text-anchor="middle" class="key-sub">run · hold to approve</text>
    <path d="M693 376h30v-8l18 16-18 16v-8h-30z" fill="#20c878"/>

    <rect x="844" y="276" width="210" height="128" rx="19" fill="#321316" stroke="#ef4444" stroke-width="4"/>
    <text x="949" y="328" text-anchor="middle" class="key-title">DECLINE / STOP</text>
    <text x="949" y="355" text-anchor="middle" class="key-sub">hold only</text>
    <rect x="937" y="365" width="24" height="24" rx="4" fill="#ef4444"/>
  </g>

  <g>
    <rect x="145" y="431" width="909" height="74" rx="13" fill="#070d17" stroke="#334155" stroke-width="2"/>
    <line x1="372" y1="431" x2="372" y2="505" stroke="#334155"/>
    <line x1="599" y1="431" x2="599" y2="505" stroke="#334155"/>
    <line x1="826" y1="431" x2="826" y2="505" stroke="#334155"/>

    <text x="258" y="460" text-anchor="middle" class="strip-title">AGENT</text>
    <text x="258" y="483" text-anchor="middle" class="strip-sub">slot · status · position</text>
    <rect x="185" y="496" width="146" height="4" rx="2" fill="#10a37f"/>

    <text x="486" y="460" text-anchor="middle" class="strip-title">REASONING / MODEL</text>
    <text x="486" y="483" text-anchor="middle" class="strip-sub">effort · live catalog</text>
    <rect x="413" y="496" width="146" height="4" rx="2" fill="#5b8cff"/>

    <text x="713" y="460" text-anchor="middle" class="strip-title">WORKFLOW</text>
    <text x="713" y="483" text-anchor="middle" class="strip-sub">implement · plan · validate</text>
    <rect x="640" y="496" width="146" height="4" rx="2" fill="#8b5cf6"/>

    <text x="940" y="460" text-anchor="middle" class="strip-title">BACKEND</text>
    <text x="940" y="483" text-anchor="middle" class="strip-sub">WSL distro · health</text>
    <rect x="867" y="496" width="146" height="4" rx="2" fill="#f4a62a"/>
  </g>

  <g>
    <circle cx="258" cy="554" r="32" fill="#0b1220" stroke="#10a37f" stroke-width="5"/>
    <circle cx="258" cy="554" r="9" fill="#475569"/>
    <text x="258" y="603" text-anchor="middle" class="dial-label">DIAL 1</text>

    <circle cx="486" cy="554" r="32" fill="#0b1220" stroke="#5b8cff" stroke-width="5"/>
    <circle cx="486" cy="554" r="9" fill="#475569"/>
    <text x="486" y="603" text-anchor="middle" class="dial-label">DIAL 2</text>

    <circle cx="713" cy="554" r="32" fill="#0b1220" stroke="#8b5cf6" stroke-width="5"/>
    <circle cx="713" cy="554" r="9" fill="#475569"/>
    <text x="713" y="603" text-anchor="middle" class="dial-label">DIAL 3</text>

    <circle cx="940" cy="554" r="32" fill="#0b1220" stroke="#f4a62a" stroke-width="5"/>
    <circle cx="940" cy="554" r="9" fill="#475569"/>
    <text x="940" y="603" text-anchor="middle" class="dial-label">DIAL 4</text>
  </g>

  <g transform="translate(145 652)">
    <circle cx="0" cy="0" r="7" fill="#f8fafc"/><text x="14" y="5" class="legend">Idle</text>
    <circle cx="120" cy="0" r="7" fill="#2388ff"/><text x="134" y="5" class="legend">Working</text>
    <circle cx="268" cy="0" r="7" fill="#20c878"/><text x="282" y="5" class="legend">Complete</text>
    <circle cx="437" cy="0" r="7" fill="#f4a62a"/><text x="451" y="5" class="legend">Input</text>
    <circle cx="565" cy="0" r="7" fill="#ef4444"/><text x="579" y="5" class="legend">Error / offline</text>
    <circle cx="780" cy="0" r="7" fill="#10a37f"/><text x="794" y="5" class="legend">Selected / verified</text>
  </g>
</svg>
